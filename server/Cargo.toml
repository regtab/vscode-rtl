[package]
name = "rtl-lsp"
version = "0.1.0"
edition = "2021"
description = "Standalone RTL (Regular Table Language) language server on the pyRegTab core"
license = "MIT"

[[bin]]
name = "rtl-lsp"
path = "src/main.rs"

[dependencies]
# The pure-Rust RTL compiler core (compiler, matcher, interpreter) from
# pyRegTab, pinned to a release tag. The pin is deliberate: RTL execution
# semantics are part of the extension's contract, and a floating `main` would
# change preview behaviour between builds with no signal at all (which is
# exactly what happened with `S_delim` in pyregtab 0.5.0). Bumping the version
# is an explicit edit of this line — see plans/PYREGTAB_050_SYNC.md and
# plans/PYREGTAB_051_SYNC.md.
pyregtab = { git = "https://github.com/regtab/pyregtab.git", tag = "v0.5.1", default-features = false }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time", "sync"] }
csv = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
strip = true
