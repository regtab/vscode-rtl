[package]
name = "rtl-lsp"
version = "0.1.0"
edition = "2021"
description = "Standalone RTL (Regular Table Language) language server on the pyRegTab core"
license = "MIT"

[[bin]]
name = "rtl-lsp"
path = "src/main.rs"

[dependencies]
# The pure-Rust RTL compiler core (plan §3.2). Interim: a sibling-checkout
# path dependency, because the prerequisite work lives on pyregtab's
# `rtl-lsp-core` branch and is not yet on GitHub (CI checks the branch out
# next to this repository). Switch to the planned pinned git dependency
# (`git = "https://github.com/regtab/pyregtab.git", tag = "v0.4.0"`) once
# pyregtab releases a version containing the `python` feature split.
pyregtab = { path = "../../pyregtab", default-features = false }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time", "sync"] }

[profile.release]
lto = true
strip = true
